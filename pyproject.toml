[project]
name = "voyage"
version = "0.1.0"
description = "Personal investment portfolio management tool with MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "akshare>=1.10",
    "yfinance>=0.2",
    "mootdx>=0.11",
    "riskfolio-lib>=6.0",
    "vectorbt>=0.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
